
<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Aerospace Quality Brief | Newsletter Archive</title>

  <meta name="description" content="The Aerospace Quality Brief newsletter archive has moved to its new location on the Lunar Research Initiative website.">

  <meta name="robots" content="noindex, follow">

  <meta name="theme-color" content="#0b1420">

  <link rel="canonical" href="https://lunarresearchinitiative.org/newsletter/archive/">

  <meta http-equiv="refresh" content="0; url=/newsletter/archive/">

  <link rel="stylesheet" href="/assets/css/style.css">

  <style>

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b1420;
      color: #f1f3f6;
      font-family: Arial, sans-serif;
    }

    .redirect-container {
      width: min(90%, 650px);
      padding: 45px 30px;
      text-align: center;
      background: #142334;
      border: 1px solid #344354;
      border-radius: 8px;
    }

    .redirect-container img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      border-radius: 50%;
      margin-bottom: 24px;
    }

    .redirect-container h1 {
      color: #ddbb7a;
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .redirect-container p {
      color: #aab8c8;
      line-height: 1.8;
      margin-bottom: 25px;
    }

    .redirect-button {
      display: inline-block;
      padding: 14px 24px;
      background: #ddbb7a;
      color: #080d14;
      font-weight: 600;
      text-decoration: none;
      border-radius: 4px;
    }

    .redirect-button:hover {
      background: #efd09a;
    }

    .redirect-button:focus-visible {
      outline: 2px solid #f1f3f6;
      outline-offset: 4px;
    }

  </style>

</head>

<body>

  <main class="redirect-container">

    <img
      src="/assets/img/LRI%20LOGO.jpeg"
      alt="Lunar Research Initiative emblem"
      width="100"
      height="100"
    >

    <h1>Aerospace Quality Brief</h1>

    <p>
      The newsletter archive has moved to its new location
      on the Lunar Research Initiative website.
    </p>

    <p>
      If your browser does not redirect automatically,
      select the button below.
    </p>

    <a
      href="/newsletter/archive/"
      class="redirect-button"
    >
      Open Newsletter Archive &rarr;
    </a>

  </main>

  <script>
    window.location.replace("/newsletter/archive/");
  </script>

</body>

</html>
